name: Current ticker model research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/current_research.py', '.github/workflows/current-research.yml']
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kratos-model-training
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-research.txt
      - run: python -m scripts.current_research
      - name: Commit immutable research records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f site/data/current-research.json site/data/framework-runs
          if ! git diff --cached --quiet; then
            git commit -m 'Record current Qlib experiments and forecasts before outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
