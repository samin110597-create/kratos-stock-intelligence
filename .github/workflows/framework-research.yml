name: Upstream framework research
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 6'
  push:
    branches: [main]
    paths: ['kratos/frameworks.py', 'scripts/framework_research.py', 'requirements-research.txt', '.github/workflows/framework-research.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kratos-public-pages
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-research.txt pytest
      - run: python -m pytest -q tests/test_frameworks.py
      - name: Recompute only changed archived datasets (no live-data claim)
        run: python -m scripts.framework_research
      - name: Preserve content-addressed research runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f site/data/frameworks.json site/data/framework-runs
          if ! git diff --cached --quiet; then
            git commit -m 'Record upstream historical framework research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
