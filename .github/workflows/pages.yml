name: Publish KRATOS Web
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'kratos/**', 'server.py', 'requirements*.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kratos-public-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.session.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Exchange calendar gate
        id: session
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from kratos.calendar import schedule, ET
          now=datetime.now(timezone.utc)
          today=now.astimezone(__import__('zoneinfo').ZoneInfo(ET)).date()
          active=False
          for symbol in ('SPY','RY.TO'):
              s=schedule(symbol,today,today)
              if not s.empty:
                  r=s.iloc[0]
                  active |= r.market_open <= now <= r.market_close + timedelta(minutes=30)
          publish=os.environ['EVENT_NAME']!='schedule' or active
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('publish='+str(publish).lower()+'\n')
          PY
      - name: Integrity and integration gates
        if: steps.session.outputs.publish == 'true'
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
        run: python -m pytest -q
      - name: Preserve historical archive; do not republish personal-use Yahoo data
        if: steps.session.outputs.publish == 'true'
        run: echo 'New market-data publication paused pending verified redistribution rights. Personal analysis runs in the protected backend.'
      - uses: actions/configure-pages@v5
        if: steps.session.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.session.outputs.publish == 'true'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
