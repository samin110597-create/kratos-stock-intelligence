services:
  - type: web
    name: kratos-personal-research
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KRATOS_BIND
        value: 0.0.0.0
      - key: KRATOS_ACCESS_TOKEN
        generateValue: true
